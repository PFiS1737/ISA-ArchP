[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
description = "Assembly implementation of the ArchP ISA"
homepage = "https://github.cim/PFiS1737/ISA-ArchP#readme"
repository = "https://github.cim/PFiS1737/ISA-ArchP"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
env_logger = "0.11.10"
insta = { version = "1.47.2", features = ["glob"] }
insta-cmd = "0.6.0"
inventory = "0.3.24"
log = "0.4.29"
once_cell = "1.21.4"
rand = "0.10.1"

[profile.dev.package]
# https://insta.rs/docs/quickstart/#optional-faster-runs
insta.opt-level = 3
similar.opt-level = 3
