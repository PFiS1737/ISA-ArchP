[package]
name = "archp_asmc"
version = "0.2.1"
edition = "2024"
description = "Assembly implementation of the ArchP ISA"
homepage = "https://github.cim/PFiS1737/ISA-ArchP#readme"
repository = "https://github.cim/PFiS1737/ISA-ArchP"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
env_logger = "0.11.9"
inventory = "0.3.22"
log = "0.4.29"
once_cell = "1.21.4"

[dev-dependencies]
insta = { version = "1.46.3", features = ["glob"] }
insta-cmd = "0.6.0"
rand = "0.10.0"
