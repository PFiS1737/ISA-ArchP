[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
description = "Assembly implementation of the ArchP ISA"
homepage = "https://github.cim/PFiS1737/ISA-ArchP#readme"
repository = "https://github.cim/PFiS1737/ISA-ArchP"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
clap = "4.6.1"
clap_complete = "4.6.5"
env_logger = "0.11.10"
insta = "1.48.0"
inventory = "0.3.24"
log = "0.4.33"
rand = "0.10.1"

archp_assembler = { path = "crates/archp_assembler" }

[profile.dev.package]
# https://insta.rs/docs/quickstart/#optional-faster-runs
insta.opt-level = 3
similar.opt-level = 3
